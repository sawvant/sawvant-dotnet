openapi: 3.1.0
info:
  contact:
    name: Sawvant
    url: https://sawvant.com
  description: |
    REST API for 2D guillotine sheet cutting optimization.
    Submit optimization jobs, poll for status, or stream progress via SSE.
  title: Sawvant Cutting Optimization API
  version: 1.0.0
servers:
- description: Production
  url: https://api.sawvant.com
security:
- apiKey: []
tags:
- description: Submit cutting optimization work.
  name: Optimization
- description: "Read job status, results and rendered cutting plans."
  name: Jobs
- description: Health and tier configuration. No authentication required.
  name: System
- description: "Small optimizations without an API key, rate limited per IP."
  name: Demo
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Service is healthy
      security: []
      summary: Health check
      tags:
      - System
  /v1/tiers:
    get:
      description: |
        Returns all available subscription tiers with their rate limits, pricing,
        and feature gates. This is the single source of truth for tier configuration.
      operationId: listTiers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TierDefinition'
                type: array
          description: List of tier definitions
      security: []
      summary: List available subscription tiers
      tags:
      - System
  /v1/optimize:
    post:
      description: |
        Validates the request synchronously, then enqueues the job for async processing.
        Returns 202 with a job ID and URLs for polling/streaming.
      operationId: createOptimization
      requestBody:
        content:
          application/json:
            examples:
              basic:
                summary: Two part types on one unlimited sheet type
                value:
                  parts:
                  - id: shelf
                    length: 600
                    width: 400
                    quantity: 8
                    grain: none
                  - id: bracket
                    length: 300
                    width: 200
                    quantity: 4
                    grain: none
                  sheets:
                  - id: mdf-18
                    length: 2440
                    width: 1220
                    quantity: 0
                    grain: none
                  machine:
                    blade_thickness: 3.2
                    max_levels: 3
                    cut_direction: default
              furniture:
                summary: Grain-constrained panels with edge banding and trim margins
                value:
                  parts:
                  - id: door-front
                    length: 700
                    width: 396
                    quantity: 6
                    grain: length
                    edge_banding:
                      top: 2
                      bottom: 2
                      left: 2
                      right: 2
                  - id: side-panel
                    length: 720
                    width: 500
                    quantity: 4
                    grain: length
                  sheets:
                  - id: oak-veneer-18
                    length: 2800
                    width: 2070
                    quantity: 0
                    grain: length
                    article_number: OAK-18-2800
                    trim_margins:
                      top: 10
                      bottom: 10
                      left: 10
                      right: 10
                  machine:
                    blade_thickness: 4.4
                    max_levels: 3
                    cut_direction: rip
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeAccepted'
          description: Job accepted and queued
        "400":
          content:
            application/json:
              examples:
                validation:
                  summary: A part with a zero length
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: "parts[0].length: must be greater than zero"
                      details:
                      - field: "parts[0].length"
                        reason: must be greater than zero
                wrongType:
                  summary: A string where a number is expected
                  value:
                    error:
                      code: INVALID_JSON
                      message: "parts.length: must be a number"
                      details:
                      - field: parts.length
                        reason: must be a number
              schema:
                $ref: '#/components/schemas/ApiError'
          description: |
            Invalid request. `error.code` says what is wrong: `INVALID_BODY`,
            `BODY_TOO_LARGE`, `INVALID_JSON`, `INVALID_STRATEGY`, `PARTS_EMPTY`,
            `SHEETS_EMPTY`, `TOO_MANY_PARTS`, `TOO_MANY_SHEETS` or
            `VALIDATION_FAILED`. For `INVALID_JSON` and `VALIDATION_FAILED`,
            `error.details` names the offending field.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: API key revoked
        "422":
          content:
            application/json:
              example:
                error:
                  code: INFEASIBLE
                  message: "1 part does not fit on any sheet: P1"
                  details:
                  - field: parts
                    reason: "part \"P1\" does not fit on any sheet, even rotated (edge\
                      \ banding and trim margins included)"
              schema:
                $ref: '#/components/schemas/ApiError'
          description: |
            Request is valid but infeasible (`INFEASIBLE`): one or more parts do
            not fit on any sheet. `error.details` has one entry per part.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal error (`INTERNAL_ERROR`)
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limiting is temporarily unavailable (`SERVICE_UNAVAILABLE`)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate limit exceeded
      summary: Submit a cutting optimization job
      tags:
      - Optimization
  /v1/optimize/batch:
    post:
      description: |
        Enqueues an array of optimization requests as individual jobs and returns
        their IDs immediately. Poll or stream each job separately.

        Maximum 50 fast jobs or 10 thorough jobs per batch. Requires a tier with
        the `batch` feature.
      operationId: createBatchOptimization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccepted'
          description: Batch accepted; jobs queued
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: "Invalid request (malformed JSON, empty batch, batch too large)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Tier does not include batch optimization
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate limit exceeded
      summary: Submit multiple cutting optimization jobs
      tags:
      - Optimization
  /v1/demo/optimize:
    post:
      description: |
        Public endpoint behind the playground on sawvant.com. No API key or
        account needed. Runs the fast strategy synchronously and returns the
        result together with an SVG cutting plan per layout, so there is no
        job to poll.

        Limits: at most 30 part types, a total part quantity of 100, 3 sheet
        types and a 64 KB request body. `strategy` must be omitted or `fast`;
        `cost_tariffs` is ignored. Each client IP may make 10 requests per
        minute and 100 per day. The input is not stored.

        Browsers may only call this endpoint from sawvant.com.
      operationId: createDemoOptimization
      requestBody:
        content:
          application/json:
            examples:
              kitchen:
                summary: A small cabinet on one sheet type
                value:
                  parts:
                  - id: side
                    length: 720
                    width: 560
                    quantity: 2
                    grain: length
                  - id: shelf
                    length: 564
                    width: 540
                    quantity: 3
                    grain: none
                  - id: door
                    length: 716
                    width: 396
                    quantity: 2
                    grain: length
                  sheets:
                  - id: oak-18
                    length: 2800
                    width: 2070
                    quantity: 0
                    grain: length
                  machine:
                    blade_thickness: 3.2
                    max_levels: 3
                    cut_direction: default
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoOptimizeResponse'
          description: Optimization result with an SVG per layout
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: Malformed JSON or a field that fails validation
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: Request body larger than 64 KB
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: |
            Over a demo limit (`DEMO_LIMIT_EXCEEDED`) or infeasible input such as a
            part larger than every sheet (`INFEASIBLE`)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: Too many demo requests from this IP. See `Retry-After`.
          headers:
            Retry-After:
              description: Seconds until the exhausted window resets
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: Unexpected server error (`INTERNAL_ERROR`)
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoError'
          description: "Too many demo runs in progress, or the server was too busy\
            \ to finish the solve in time (`DEMO_BUSY`). Retry after a few seconds."
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              explode: false
              schema:
                type: integer
              style: simple
      security: []
      summary: Run a small optimization without an API key
      tags:
      - Demo
  /v1/jobs/{id}/diagram:
    get:
      description: |
        Returns one sheet layout of a completed job as an SVG cutting plan with
        dimensions and grain direction.
      operationId: getJobDiagramSVG
      parameters:
      - $ref: '#/components/parameters/JobID'
      - description: Index into the job's `layouts` array
        explode: true
        in: query
        name: sheet
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            image/svg+xml:
              schema:
                type: string
          description: SVG cutting plan
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid job ID or sheet index
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Job not found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: "Job is not completed, or has no layouts"
      summary: Render a cutting plan as SVG
      tags:
      - Jobs
  /v1/jobs/{id}/diagram.pdf:
    get:
      description: |
        Returns every sheet layout of a completed job as a printable PDF
        cutting plan.
      operationId: getJobDiagramPDF
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
          description: PDF cutting plan
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid job ID
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Job not found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Job is not completed
      summary: Render a cutting plan as PDF
      tags:
      - Jobs
  /v1/jobs/{id}:
    get:
      description: "Returns the current state of a job including progress, result,\
        \ and errors."
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Job found
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid job ID format
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Job not found
      summary: Get job status
      tags:
      - Jobs
  /v1/jobs/{id}/stream:
    get:
      description: |
        Server-Sent Events stream that emits `progress`, `completed`, or `failed` events.
        The stream closes automatically when the job reaches a terminal state.

        A `: heartbeat` comment is sent every 30 seconds to keep the connection alive
        through proxies and load balancers. SSE clients ignore these automatically.
      operationId: streamJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: |
                  SSE events with `event:` and `data:` fields.
                  Event types: `progress`, `completed`, `failed`, `error`.
                  Data is a JSON-encoded JobResponse.
                type: string
          description: SSE event stream
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid job ID format
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Job not found
      summary: Stream job progress via SSE
      tags:
      - Jobs
components:
  parameters:
    JobID:
      description: Job UUID
      explode: false
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  schemas:
    TierDefinition:
      example:
        features:
          sse: true
          thorough: true
          metrics: true
          cost: true
        period: month
        price_eur_cents: 3900
        rate_limit_fast: 100
        name: pro
        rate_limit_thorough: 20
        display_name: Pro
      properties:
        name:
          example: pro
          type: string
        display_name:
          example: Pro
          type: string
        price_eur_cents:
          example: 3900
          type: integer
        period:
          example: month
          type: string
        rate_limit_fast:
          description: Maximum fast strategy requests per 24h sliding window
          example: 100
          type: integer
        rate_limit_thorough:
          description: Maximum thorough strategy requests per 24h sliding window
          example: 20
          type: integer
        features:
          additionalProperties:
            type: boolean
          description: Feature gates enabled for this tier
          example:
            sse: true
            thorough: true
            metrics: true
            cost: true
      required:
      - display_name
      - features
      - name
      - price_eur_cents
      - rate_limit_fast
      - rate_limit_thorough
    HealthResponse:
      example:
        status: ok
      properties:
        status:
          example: ok
          type: string
      required:
      - status
    Error:
      example:
        error: error
      properties:
        error:
          type: string
      required:
      - error
    ApiError:
      description: |
        Structured error. Used by `POST /v1/optimize`; the other endpoints still
        return `Error` and move to this shape later.
      example:
        error:
          code: INVALID_BODY
          details:
          - reason: must be greater than zero
            field: "parts[2].width"
          - reason: must be greater than zero
            field: "parts[2].width"
          message: message
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorBody'
      required:
      - error
    ApiErrorBody:
      example:
        code: INVALID_BODY
        details:
        - reason: must be greater than zero
          field: "parts[2].width"
        - reason: must be greater than zero
          field: "parts[2].width"
        message: message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: Human-readable explanation. Do not parse it; use `code` and
            `details`.
          type: string
        details:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
      required:
      - code
      - message
    ErrorCode:
      description: "Stable, machine-readable error code. New codes may be added."
      enum:
      - INVALID_BODY
      - BODY_TOO_LARGE
      - INVALID_JSON
      - INVALID_STRATEGY
      - PARTS_EMPTY
      - SHEETS_EMPTY
      - TOO_MANY_PARTS
      - TOO_MANY_SHEETS
      - VALIDATION_FAILED
      - INFEASIBLE
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      type: string
    FieldError:
      example:
        reason: must be greater than zero
        field: "parts[2].width"
      properties:
        field:
          description: |
            JSON path of the field, e.g. `parts[2].width` or `machine.max_levels`.
            For `INVALID_JSON` the path has no array index (`parts.width`).
          example: "parts[2].width"
          type: string
        reason:
          example: must be greater than zero
          type: string
      required:
      - field
      - reason
    RateLimitError:
      example:
        limit: 0
        error: rate limit exceeded
        strategy: fast
        remaining: 6
      properties:
        error:
          example: rate limit exceeded
          type: string
        limit:
          description: Request limit for this tier and strategy (24h sliding window)
          type: integer
        remaining:
          description: Remaining requests in the current window
          type: integer
        strategy:
          description: Which strategy quota was exceeded
          enum:
          - fast
          - thorough
          type: string
      required:
      - error
      - limit
      - remaining
      - strategy
    DemoError:
      example:
        error:
          code: DEMO_LIMIT_EXCEEDED
          message: "too many part types: the demo allows at most 30, got 42"
      properties:
        error:
          $ref: '#/components/schemas/DemoError_error'
      required:
      - error
    DemoOptimizeResponse:
      example:
        summary:
          sheets_used:
          - article_number: article_number
            quantity: 2
