            "y": 1.4658129805029452
            rotated: true
            part_id: part_id
            grain: none
            height: 5.637376656633329
      properties:
        layouts:
          items:
            $ref: '#/components/schemas/DemoLayout'
          type: array
        summary:
          $ref: '#/components/schemas/Summary'
        metrics:
          $ref: '#/components/schemas/Metrics'
